<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natura | Mumo Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;--bg:#000;--card:#0e0e0e;--line:#2a2415;--gold:#d4af37;--gold2:#f7de8c;--txt:#ece2c8;--mut:#9a8f73;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 Georgia,"Times New Roman",serif}
.w{max-width:720px;margin:0 auto;padding:16px 14px 40px}
header{text-align:center;padding:8px 0 14px}
header img{width:110px;height:110px;border-radius:50%}
h1{font:700 44px "Cormorant Garamond",Georgia,serif;letter-spacing:.35em;margin:6px 0 0 .35em;background:linear-gradient(var(--gold2),var(--gold),#92681c);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:14px;letter-spacing:.08em}
.tabs{display:flex;gap:8px;margin:14px 0 10px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--gold);font:inherit;font-weight:700}
.tabs .on{background:var(--gold);color:#000}
.tabs [disabled]{opacity:.45;border-style:dashed}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chips button{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:14px}
.chips .on{border-color:var(--gold);color:#000;background:var(--gold)}
h2{font:700 26px "Cormorant Garamond",Georgia,serif;color:var(--gold);margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.n{flex:1;min-width:0;font-size:15px}.it img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none}.pc{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}.pc s{color:var(--mut);font-size:12px}
.it b{color:var(--gold2);white-space:nowrap}
.it a{padding:7px 10px;border-radius:8px;background:var(--gold);color:#000;text-decoration:none;font-weight:700;font-size:14px}
footer{margin-top:26px;text-align:center;color:var(--mut);font-size:13px}
</style>
</head>
